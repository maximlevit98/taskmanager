services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: content
      POSTGRES_PASSWORD: content
      POSTGRES_DB: content
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgres://content:content@db:5432/content
      SESSION_SECRET: local-dev-session-secret
      INVITE_SMTP_URL: ${INVITE_SMTP_URL:-}
      INVITE_FROM: ${INVITE_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3010}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
